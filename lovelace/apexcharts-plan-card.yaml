# Anker X1 SmartGrid — plan visualization card
#
# Requires TWO HACS frontend cards:
#   1. apexcharts-card  → HACS → Frontend → "apexcharts-card"      → install
#   2. config-template-card → HACS → Frontend → "config-template-card" → install
#   (then refresh the browser / Ctrl-F5)
#
# Why config-template-card? apexcharts-card's `graph_span` is a static string and
# cannot read entity data, so a fixed window (e.g. 36h) clips the chart when
# Zonneplan returns more tariff hours and leaves blank space when it returns
# fewer. config-template-card wraps the chart and recomputes `graph_span` from the
# horizon's last timestamp, so the x-axis ends exactly where the data ends —
# dynamic to however many hours Zonneplan currently provides.
#
# Entity: confirm the exact id in Developer Tools → States (search "smartgrid plan").
# Replace `sensor.smartgrid_plan` below if your id differs.
#
# NOTE: legend and header value readouts are intentionally OFF (show_states:
# false). Every plan series reads the same entity (whose unit is "h" = planned
# grid hours), and ApexCharts would otherwise print each series' LAST horizon
# point — deep night, i.e. 0 — with a bogus "h" suffix ("Solar forecast: 0 h").
# Horizon values are per-slot kWh energy (not instantaneous power); the custom
# hover tooltip carries the real values in kWh.
#
# The ML predictor status is rendered into the header TITLE via
# config-template-card, NOT as an apexcharts series. Do NOT retry
# `in_header: raw` for it: apexcharts-card v2.2.3 pushes every header value
# through parseFloat() before display, so a non-numeric string like
# "ML in ~1d" renders as NaN. There, `raw` means "unrounded number", not
# "verbatim string". config-template-card evaluates ${...} at any config
# depth, so a templated title is the working path for arbitrary text.
type: custom:config-template-card
# Listed entities trigger a re-render (and thus a graph_span recompute) on update.
entities:
  - sensor.smartgrid_plan
  # Source of the subtitle's today net (see NET below).
  - sensor.smartgrid_daily_stats
  # Required for the header title to refresh when the predictor tier or its
  # ETA changes — config-template-card only re-renders on LISTED entities.
  - sensor.smartgrid_active_load_model
variables:
  H: states['sensor.smartgrid_plan'].attributes.horizon || []
  # Real-tariff horizon only. The estimated-tomorrow tail (spec
  # 2026-07-31-plan-estimated-tail) is display-suppressed as of
  # spec 2026-08-01-card-crop-daily-stats: the chart ends where real
  # Zonneplan/Frank tariff ends. The plan sensor still EMITS the tail —
  # the DP needs it for terminal value — this only stops drawing it.
  HR: (states['sensor.smartgrid_plan'].attributes.horizon || []).filter(function (h) { return !h.estimated; })
  # Today's battery cash net: measured so far PLUS the plan's remainder for the
  # rest of the LOCAL day — the same figure the daily-stats table's today row
  # carries. Deliberately NOT the plan sensor's arbitrage_pnl, which spans the
  # whole ~42h horizon and so answered a different question than the subtitle
  # implied (a two-day number sitting next to a one-day one).
  #
  # Matched on the local date rather than taken as the last row: the table also
  # carries FUTURE days whenever tomorrow's real tariff has published, so the
  # today row is not the tail. `new Date()` is browser-local, the same clock
  # graph_span above already uses.
  #
  # Double-quoted on purpose: the ternary's " : " would otherwise terminate a
  # YAML plain scalar ("mapping values are not allowed here").
  NET: "(function () { var e = states['sensor.smartgrid_daily_stats']; var rows = (e && e.attributes.days) || []; var n = new Date(); var key = n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2); for (var i = 0; i < rows.length; i++) { if (rows[i].date === key && !isNaN(Number(rows[i].net_eur))) return Number(rows[i].net_eur); } return null; })()"
  # Predictor tier status (spec 2026-07-21). Guarded on both the entity and the
  # attribute so a restart mid-render shows "—" rather than "undefined".
  # Double-quoted on purpose: the ternary's " : " would otherwise terminate a
  # YAML plain scalar.
  PRED: "(states['sensor.smartgrid_active_load_model'] && states['sensor.smartgrid_active_load_model'].attributes.ml_status) ? states['sensor.smartgrid_active_load_model'].attributes.ml_status : '—'"
  # Calibration cycle state (spec 2026-08-03). `state` is one of idle |
  # scheduled | charging | holding; `scheduled` means a window has been picked
  # for later and is drawable but is NOT actuating yet. Guarded so a restart
  # mid-render yields idle rather than throwing on a missing attribute.
  CAL: "(function () { var e = states['sensor.smartgrid_plan']; var a = (e && e.attributes) || {}; return { state: a.calibration_state || 'idle', s: a.calibration_window_start, e: a.calibration_window_end, target: a.calibration_target_soc, hold: a.calibration_hold_soc }; })()"
card:
  type: custom:apexcharts-card
  header:
    show: true
    # Single line + double-quoted, same constraint as graph_span below.
    title: "${ 'SmartGrid plan · next 24h  ·  Predictor: ' + PRED + (CAL.state !== 'idle' ? '  ·  ⚡ Calibration ' + CAL.state + ' → ' + CAL.target + '% for ' + ((new Date(CAL.e) - new Date(CAL.s)) / 3600000).toFixed(1) + 'h' : '') }"
    show_states: false
  # Dynamic window: span from 2h before the current hour (to show recent history)
  # to one hour past the last horizon slot (so the final hourly column shows in
  # full). The horizon already carries past slots (is_past_horizon), so the extra
  # 2h render real data, not blank space. Falls back to 38h when the horizon is
  # empty (e.g. before the first plan publishes).
  # The "+ 3" = 1h tail past the last slot + 2h of history added to graph_span to
  # match the span.start offset below (so the window END stays at last slot + 1h).
  # Single line + double-quoted on purpose: config-template-card strips a template
  # with value.substring(2, len-1) (drops "${" and the LAST char, expecting "}").
  # A YAML ">" folded scalar would append a trailing "\n", so it would strip the
  # newline and leave a dangling "}" → "Unexpected token '}'". Keep it one line.
  graph_span: "${ HR.length ? Math.max(1, Math.ceil((new Date(HR[HR.length - 1].start).getTime() - new Date().setMinutes(0, 0, 0)) / 3600000) + 3) + 'h' : '38h' }"
  span:
    start: hour
    # Begin the window 2h before the current hour to surface recent history.
    offset: -2h
  now:
    show: true
    label: now
  yaxis:
    # All y-axis scales are hidden with show:false to keep the plot clean — each
    # series still scales to its axis by id; only the visible scales/labels are
    # removed. Values remain readable via the custom hover tooltip (apex_config).
    - id: price
      decimals: 2
      show: false
    - id: power
      opposite: true
      min: 0
      show: false
    - id: soc
      opposite: true
      min: 0
      max: 100
      show: false
    - id: energy
      opposite: true
      # "Log scale" for the charge/export bars is done by transforming the DATA —
      # each bar data_generator plots log10(Wh) = log10(kWh × 1000) — NOT a
      # native log axis (which breaks columns). This lifts small bars (a few
      # hundred Wh) into a visible band instead of being squashed under the
      # multi-kWh bars. Floor: log10(1) = 0, so the baseline (min 0) is 1 Wh.
      # The hover tooltip reverses it (10^v ÷ 1000) to show real kWh.
      min: 0
      show: false
  series:
    - entity: sensor.smartgrid_plan
      name: Price
      type: line
      yaxis_id: price
      stroke_width: 2.5
      color: "#8b5cf6"
      show:
        legend_value: false
      data_generator: |
        return (entity.attributes.horizon || []).filter(h => !h.estimated).map(h => [new Date(h.start).getTime(), h.price]);
    - entity: sensor.smartgrid_plan
      name: Solar forecast
      type: area
      yaxis_id: power
      opacity: 0.3
      color: "#fbbf24"
      show:
        legend_value: false
      data_generator: |
        return (entity.attributes.horizon || []).filter(h => !h.estimated).map(h => [new Date(h.start).getTime(), h.pv_kwh]);
    - entity: sensor.smartgrid_plan
      name: Predicted load
      type: line
      yaxis_id: power
      stroke_width: 1
      color: var(--secondary-text-color)
      show:
        legend_value: false
      data_generator: |
        return (entity.attributes.horizon || []).filter(h => !h.estimated).map(h => [new Date(h.start).getTime(), h.load_kwh]);
    - entity: sensor.smartgrid_plan
      name: Projected SoC
      type: line
      yaxis_id: soc
      stroke_width: 2.5
      color: "#3b82f6"
      show:
        legend_value: false
      data_generator: |
        return (entity.attributes.horizon || []).filter(h => !h.estimated).map(h => [new Date(h.start).getTime(), h.soc]);
    - entity: sensor.smartgrid_plan
      name: Grid charge
      type: column
      yaxis_id: energy
      color: "#ef4444"
      show:
        legend_value: false
      data_generator: |
        return (entity.attributes.horizon || []).filter(h => !h.estimated).map(h => [new Date(h.start).getTime(), h.grid_charge_kwh > 0.05 ? Math.log10(Math.max(1, h.grid_charge_kwh * 1000)) : null]);
    - entity: sensor.smartgrid_plan
      name: Solar charge
      type: column
      yaxis_id: energy
      color: "#f59e0b"
      show:
        legend_value: false
      data_generator: |
        return (entity.attributes.horizon || []).filter(h => !h.estimated).map(h => [new Date(h.start).getTime(), h.solar_charge_kwh > 0 ? Math.log10(Math.max(1, h.solar_charge_kwh * 1000)) : null]);
    # --- Export series (arbitrage leg) ---
    # Grid export bars plot POSITIVE per-slot kWh on the same energy axis as the
    # charge bars (charge and export never occur in the same hour, so they never
    # overlap). Amber color distinguishes export from the red/green charge bars
    # at a glance.
    - entity: sensor.smartgrid_plan
      name: Grid export
      type: column
      yaxis_id: energy
      color: "#10b981"
      show:
        legend_value: false
      data_generator: |
        return (entity.attributes.horizon || []).filter(h => !h.estimated).map(h => [new Date(h.start).getTime(), h.grid_export_kwh > 0.05 ? Math.log10(Math.max(1, h.grid_export_kwh * 1000)) : null]);
    # ── Calibration band (spec 2026-08-03) ────────────────────────────────
    # The two edges of the dwell band: charge target on top, continuation bar
    # below. "In the band while FORCING" is exactly when the dwell clock runs,
    # so this shows at a glance whether the pack got there and stayed.
    #
    # These map the FULL horizon and emit null outside the window rather than
    # emitting two points at the window edges. The values are constants, so the
    # short form is tempting — but this is a mixed column+line chart, and a
    # series whose x-array differs from every other series does not reliably
    # render against its own timestamps: the first attempt used two points and
    # the lines stretched past the window to the right edge of the chart.
    # Sharing the horizon's x-array makes them align exactly like every other
    # series. Keep the filter and the null padding.
    #
    # The VALUES still come from the calibration attributes, never from a
    # horizon field: calibration is quarantined outside the DP, so no horizon
    # row knows about it and Projected SoC stays the DP's real projection.
    #
    # Both go all-null when the state is idle, so nothing is drawn whenever no
    # cycle is pending.
    - entity: sensor.smartgrid_plan
      name: Calib target
      type: line
      yaxis_id: soc
      stroke_width: 1.5
      color: "#f59e0b"
      show:
        legend_value: false
      data_generator: |
        const a = entity.attributes; const v = a.calibration_target_soc;
        const on = a.calibration_state !== 'idle' && a.calibration_window_start && v != null;
        const s = on ? new Date(a.calibration_window_start).getTime() : 0;
        const e = on ? new Date(a.calibration_window_end).getTime() : 0;
        return (a.horizon || []).filter(h => !h.estimated).map(h => { const t = new Date(h.start).getTime(); return [t, (on && t >= s && t <= e) ? v : null]; });
    - entity: sensor.smartgrid_plan
      name: Calib hold bar
      type: line
      yaxis_id: soc
      stroke_width: 1.5
      color: "#f59e0b"
      show:
        legend_value: false
      data_generator: |
        const a = entity.attributes; const v = a.calibration_hold_soc;
        const on = a.calibration_state !== 'idle' && a.calibration_window_start && v != null;
        const s = on ? new Date(a.calibration_window_start).getTime() : 0;
        const e = on ? new Date(a.calibration_window_end).getTime() : 0;
        return (a.horizon || []).filter(h => !h.estimated).map(h => { const t = new Date(h.start).getTime(); return [t, (on && t >= s && t <= e) ? v : null]; });
  apex_config:
    chart:
      height: 380
    plotOptions:
      bar:
        columnWidth: "55%"
        borderRadius: 3
    # NOTE: both arrays below are POSITIONAL — one entry per series, in series
    # order. The last two entries are the calibration band edges; adding or
    # reordering series means updating both arrays or every style after the
    # insertion point silently shifts onto the wrong series.
    fill:
      type: [solid, gradient, solid, solid, solid, solid, solid, solid, solid]
      gradient:
        shadeIntensity: 0.3
        opacityFrom: 0.5
        opacityTo: 0.05
        stops: [0, 100]
    stroke:
      # Dashed (6) for the two calibration edges: they are a target, not
      # measured or projected data, and must not read as either.
      dashArray: [0, 0, 0, 0, 0, 0, 0, 6, 6]
    subtitle:
      # Today's net only — one number, green/red by sign. Reads "—" until the
      # stats table has published (first tick after a restart).
      text: "${ NET != null ? 'Today ' + (NET >= 0 ? '+' : '') + NET.toFixed(2) + ' €' : 'Today —' }"
      align: left
      offsetY: 4
      style:
        fontSize: "13px"
        fontWeight: 600
        color: "${ NET != null && NET < 0 ? '#ef4444' : '#10b981' }"
    legend:
      show: true
      position: bottom
      horizontalAlign: center
      fontSize: "12px"
      markers:
        width: 10
        height: 10
        radius: 12
      itemMargin:
        horizontal: 8
        vertical: 2
    grid:
      borderColor: "rgba(127,127,127,0.15)"
      strokeDashArray: 3
      xaxis:
        lines:
          show: false
      yaxis:
        lines:
          show: true
    # Shades the calibration window (spec 2026-08-03). There must be exactly
    # ONE `annotations` key in this mapping — a second one silently wins over
    # the first under YAML last-key-wins, which is how the first attempt at
    # this became a no-op.
    #
    # The idle branch returns the original [{x: 0, x2: 0}] placeholder rather
    # than [], so behaviour with no cycle pending is byte-identical to before.
    annotations:
      xaxis: "${ (CAL.state !== 'idle' && CAL.s) ? [{ x: new Date(CAL.s).getTime(), x2: new Date(CAL.e).getTime(), fillColor: '#f59e0b', opacity: 0.12, label: { text: 'calibration · ' + CAL.state, orientation: 'horizontal', position: 'top', style: { background: '#f59e0b', color: '#fff', fontSize: '10px' } } }] : [{ x: 0, x2: 0 }] }"
    # Hover tooltip: list EVERY series' value at the hovered hour. We render it
    # ourselves (tooltip.custom) instead of relying on ApexCharts' built-in
    # shared tooltip, which collapses to a single series here because all series
    # are data_generator-based with non-aligned x-values (apexcharts-card #593).
    # The custom fn takes the hovered timestamp and looks up each series' value
    # AT THAT x via w.globals.seriesX, so misaligned/short series just drop out.
    # Per-series units fix the bogus shared "h" unit the note above warns about.
    # All energy series (PV, load, charge/export bars) display in kWh; the bar
    # series additionally reverse the log10(Wh) plot transform before formatting.
    # EVAL: makes apexcharts-card compile it; no ${...} inside, so
    # config-template-card leaves it untouched.
    tooltip:
      shared: true
      intersect: false
      custom: |
        EVAL:function ({ seriesIndex, dataPointIndex, w }) {
          var g = w.globals;
          var x = g.seriesX[seriesIndex][dataPointIndex];
          var barSeries = { 'Grid charge': 1, 'Solar charge': 1, 'Grid export': 1 };
          // Every series on yaxis_id: soc. The lookup defaults to kWh, so a
          // SoC-axis series missing here renders as "100.00 kWh".
          var pctSeries = { 'Projected SoC': 1, 'Calib target': 1, 'Calib hold bar': 1 };
          var unit = function (name) {
            return name === 'Price' ? '€/kWh'
              : pctSeries[name] ? '%'
              : 'kWh';
          };
          var fmt = function (name, v) {
            var u = unit(name);
            if (barSeries[name]) v = Math.pow(10, v) / 1000;
            var d = u === '€/kWh' ? 3 : u === 'kWh' ? 2 : 0;
            return Number(v).toFixed(d) + ' ' + u;
          };
          var rows = '';
          for (var i = 0; i < g.series.length; i++) {
            var xi = g.seriesX[i], j = -1;
            for (var k = 0; k < xi.length; k++) { if (xi[k] === x) { j = k; break; } }
            if (j === -1) continue;
            var v = g.series[i][j];
            if (v === null || v === undefined) continue;
            rows += '<div style="display:flex;align-items:center;gap:6px;padding:1px 8px;">'
              + '<span style="width:8px;height:8px;border-radius:50%;background:' + (g.colors[i] || '#888') + ';"></span>'
              + '<span style="flex:1;margin-right:10px;">' + g.seriesNames[i] + '</span>'
              + '<b>' + fmt(g.seriesNames[i], v) + '</b></div>';
          }
          var dt = new Date(x);
          var p = function (n) { return (n < 10 ? '0' : '') + n; };
          var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          var head = days[dt.getDay()] + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
          return '<div style="padding:4px 0;font-size:12px;line-height:1.6;">'
            + '<div style="font-weight:600;padding:2px 8px;">' + head + '</div>'
            + rows + '</div>';
        }
