<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>smartgrid-power-card harness</title>
<!--
  Fixture page for the power card, not served by Home Assistant.
  ?case=normal|unpublished|dst|wide|missing|noattrs|disabled|noswitch|late|debug-empty|debug-fail|debug-gap|debug-mixed|debug-stale|debug-throw  ?theme=dark|light  ?title=1  ?w=<card px>  ?fonts=<url of a folder with Roboto-*.woff2>
  ?model=active|unreachable|waiting|gate|gate-thin|off|missing  the stubbed sensor.smartgrid_active_load_model (default active); checks the forecast line under the legend
  ?detail=0|1  stores the card's hour-detail open state before it mounts (without it the stored state is cleared, so the card starts as debug says)
  ?debug=1  sets debug: true, the default open state when no detail is given; the stubbed websocket answers with the hours perturbed as the day's first plan, each hour's reason and the slots' grid cost (debug-empty: no plan stored, no past reasons, debug-fail: the call fails, debug-gap: one mid-hour slot missing from the plan and no export price in export hours, debug-mixed: yesterday's plan in hourly slots, debug-stale: stale inputs, debug-throw: an answer the inspector cannot format)
  ?view=cost|use|sun  with debug, presses that panel switch (cost is the default) and checks it reads pressed
  ?pick=<hour start prefix>  with debug, clicks that hour in the debug panel and checks the inspector's caption changed (today 14 and 15: selling blocked by the reserve, a rule; past hours: a stored reason)
  ?hover=<hour start prefix, e.g. 2026-11-14T08>&py=<px from the card top>  points at that hour; &touch=1 taps instead, &rerender=1 then pushes a new state
    every hover run also checks, on hours it picks itself, that a planned hour priced at or above the card's break-even (fixture 0.34) shows the Break-even row with `above` and one below it shows `below`, each with the positive difference, and that a measured hour shows no row; it fails when the fixture lacks any of the three
    &touch=1&slide=<hour start prefix>  puts a finger down on the hover hour and slides it sideways to that hour, then lifts it; checks the tooltip followed (with debug: the caption changed)
    &touch=1&drag=<hour start prefix>  after the tap, drags a finger up on that hour until the browser would take the pan; checks the tooltip stayed (with debug: the caption too)
  ?trim=1  gives the card sensor's hourly rows as the server publishes them: the values it omits left out (price, soc and the grid figures when null, use and solar when 0, plan when false), then packed (start as minutes m from pack.base with pack.tz offsets, grid figures as g, why.kept_for as why.kf into pack.kf); the debug answer still gets the full rows, and a trimmed run must draw the same as an untrimmed one
  ?live=import|export|big|zero|sunny|nopv|none  the live row's fixture (default import): the meter reads 1840, -3200, 12000 (big: checks the Grid cell reads 12.0 kW with an import arrow), 20 W or -1400 W with solar at 1850 W (sunny: solar in kW, for the 440 and 480 px fit); nopv makes the first solar sensor unavailable; none leaves the live attribute off the card sensor, so no row; every run checks the Price cell reads €0.27, the Grid and Battery cells' arrows and charge/export classes against live and batt, the price tick at (price - 0.12) / (0.43 - 0.12) of its track, and that each bar's width is its value over the largest of the four powers shown (a track of 0 when all are 0)
  ?batt=charge|discharge|idle|none  the battery sensor (default discharge): -9200, 291 or 20 W (positive discharges); none leaves live.battery out
  ?scroll=1  with detail=1 and a window shorter than the card, focuses the More button, scrolls it out of view, points at four hours in turn and checks the page did not scroll
  ?push=1  after mount, gives the house sensor a new state of 950 W in a new hass and checks that the House cell reads 950 W and its bar width changed, without the card re-rendering
  ?price=next  puts the next quarter's price in the past and checks that the Price cell shows it; with push=1 the quarter is still ahead at mount, then the clock moves past it with the house push and the check is that the Price cell shows it without a re-render
  Chrome (a window of 500 px or less renders the wall's 456 px card): --headless=new --force-device-scale-factor=1.5 --window-size=464,459 --screenshot=out.png "file://…/harness.html?case=normal&theme=dark"
-->
<style>
  body { margin: 0; padding: 4px; font-family: Roboto, system-ui, sans-serif; background: var(--primary-background-color); }
  body.dark {
    --primary-background-color: #000; --card-background-color: #1a1917; --ha-card-background: #1a1917;
    --primary-text-color: #efe8da; --secondary-text-color: #8f887e; --divider-color: #2a2824;
  }
  body { --success-color: #4caf50; --warning-color: #ffa600; }
  #status { position: fixed; left: 4px; bottom: 2px; font: 11px monospace; color: #888; }
  body.light {
    --primary-background-color: #fafafa; --card-background-color: #fff;
    --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0, 0, 0, .12);
  }
</style>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  window.STATUS = { size: '', error: 'no errors', rerender: '' };
  window.showStatus = () => {
    const el = document.getElementById('status');
    if (el) el.textContent = `${STATUS.size} · ${STATUS.error} · ${STATUS.rerender}${STATUS.ws ? ` · ${STATUS.ws}` : ''}${STATUS.live ? ` · ${STATUS.live}` : ''}`;
  };
  const logError = console.error;
  console.error = (...args) => {
    STATUS.error = args.join(' ');
    showStatus();
    logError(...args);
  };
  addEventListener('error', (e) => {
    STATUS.error = e.message;
    showStatus();
  });
  const CASE = q.get('case') || 'normal';
  if (q.get('fonts')) {
    const f = q.get('fonts');
    const css = [['400', 'Regular'], ['500', 'Medium'], ['700', 'Bold']]
      .map(([w, n]) => `@font-face{font-family:Roboto;font-weight:${w};src:url(${f}/Roboto-${n}.woff2)}`).join('');
    document.head.insertAdjacentHTML('beforeend', `<style>${css}</style>`);
  }

  const TZ = 'Europe/Amsterdam';
  const H = 3600e3;
  const fmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });
  function parts(t) {
    const p = {};
    for (const x of fmt.formatToParts(t)) p[x.type] = +x.value;
    return p;
  }
  function offsetMin(t) {
    const p = parts(t);
    return (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - t) / 60000;
  }
  function midnight(date) {
    const [y, m, d] = date.split('-').map(Number);
    const u = Date.UTC(y, m - 1, d);
    let t = u;
    for (let i = 0; i < 2; i++) t = u - offsetMin(t) * 60000;
    return t;
  }
  function iso(t) {
    const p = parts(t);
    const o = offsetMin(t);
    const z = (n) => String(n).padStart(2, '0');
    return `${p.year}-${z(p.month)}-${z(p.day)}T${z(p.hour)}:${z(p.minute)}:00${o < 0 ? '-' : '+'}${z(Math.abs(o) / 60)}:00`;
  }
  function addDays(date, k) {
    const [y, m, d] = date.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + k)).toISOString().slice(0, 10);
  }

  const TODAY = CASE === 'dst' ? '2026-10-25' : '2026-11-13';
  const NOW = midnight(TODAY) + (CASE === 'dst' ? 15 : CASE === 'late' ? 22 : 14) * H + 20 * 60e3;
  Date.now = () => NOW;

  const PRICE = [0.29, 0.28, 0.28, 0.27, 0.28, 0.3, 0.33, 0.4, 0.44, 0.41, 0.36, 0.35, 0.34, 0.32, 0.33, 0.35, 0.38, 0.43, 0.45, 0.44, 0.4, 0.37, 0.35, 0.32];
  const USE = [0.35, 0.3, 0.3, 0.3, 0.3, 0.35, 0.55, 0.9, 0.85, 0.6, 0.5, 0.5, 0.55, 0.5, 0.45, 0.5, 0.7, 1.1, 1.2, 1.1, 0.9, 0.8, 0.6, 0.45];

  function build() {
    const dates = [-1, 0, 1].map((k) => addDays(TODAY, k));
    const until = midnight(addDays(dates[2], 1));
    // Before tomorrow's prices are out the planner's estimated tail carries use and solar only.
    const unpriced = (k) => CASE === 'unpublished' && k === 2;
    const nowHour = NOW - ((NOW - midnight(TODAY)) % H);
    const hours = [];
    let soc = 25;
    for (let t = midnight(dates[0]); t < until; t += H) {
      const hh = parts(t).hour;
      const k = dates.indexOf(iso(t).slice(0, 10));
      let state = 'idle';
      if (hh >= 1 && hh <= 4) state = 'charge_grid';
      else if (hh === 8 || hh === 9) state = 'export';
      else if (hh === 7 || (hh >= 17 && hh <= 21)) state = 'house';
      else if (hh >= 10 && hh <= 16) state = 'hold';
      if (k === 2 && hh >= 11 && hh <= 13) state = 'charge_solar';
      const delta = { charge_grid: 24, charge_solar: 4, house: -9, export: -19 }[state] || 0;
      soc = Math.max(5, Math.min(100, soc + delta));
      const sun = hh >= 9 && hh <= 15 ? Math.round(0.6 * [0.4, 0.55, 0.85][k] * Math.sin((Math.PI * (hh - 8.5)) / 7.5) * 100) / 100 : 0;
      const use = Math.round(USE[hh] * (1 + 0.08 * Math.sin(hh * 3 + k)) * 100) / 100;
      const r2 = (v) => Math.round(v * 100) / 100;
      const est = unpriced(k);
      hours.push({
        start: iso(t),
        price: est ? null : Math.round((PRICE[hh] + k * 0.012 + 0.008 * Math.sin(hh + k)) * 1000) / 1000,
        soc: est ? null : soc,
        state: est ? 'idle' : state,
        use_kwh: use,
        solar_kwh: sun,
        plan: t >= nowHour,
        grid_in_house_kwh: est ? null : state === 'house' || state === 'export' ? 0.03 : r2(Math.max(use - sun, 0)),
        grid_in_charge_kwh: est ? null : state === 'charge_grid' ? r2((delta / 100) * 20.48 / 0.95) : 0,
        grid_out_kwh: est ? null : state === 'export' ? r2((-delta / 100) * 20.48 * 0.95) : r2(Math.max(sun - use - (state === 'charge_solar' ? 0.8 : 0), 0)),
        batt_house_kwh: !est && (state === 'house' || state === 'export') ? r2(Math.max(use - sun - 0.03, 0)) : 0,
      });
    }
    // One row as an older backend sends it, without the battery-to-house figure.
    delete hours.find((h) => h.start.startsWith(`${dates[1]}T07`)).batt_house_kwh;
    // Planner reasons as the backend builds them: the richest later release, kept only when it agrees with the action.
    const value = (h) => (h.state === 'export' ? h.price - 0.05 : h.price * 0.9 - 0.03);
    const r3 = (v) => Math.round(v * 1000) / 1000;
    hours.forEach((h, n) => {
      if (!h.plan || h.price === null) return;
      let best = -1;
      for (let j = n + 1; j < hours.length; j++) {
        const x = hours[j];
        if (x.price !== null && (x.state === 'export' || x.state === 'house') && (best < 0 || value(x) > value(hours[best]))) best = j;
      }
      const keep = best < 0 ? 0.3 : value(hours[best]);
      const use = h.state === 'charge_grid' ? h.price / 0.9 : value(h);
      if (h.state === 'export' || h.state === 'house' ? use < keep : keep < use) return;
      let [a, b] = [best, best];
      while (best >= 0 && a - 1 > n && hours[a - 1].state === hours[best].state) a--;
      while (best >= 0 && b + 1 < hours.length && hours[b + 1].state === hours[best].state) b++;
      const release = h.state === 'export' || h.state === 'house';
      const nextDay = { start: iso(until), end: null, kind: 'next_day' };
      let kept_for = best < 0 ? nextDay : { start: hours[a].start, end: iso(Date.parse(hours[b].start) + H), kind: hours[best].state };
      if (release) {
        // A release hour is weighed against refilling in the next grid-charge run.
        const c = hours.findIndex((x, j) => j > n && x.state === 'charge_grid');
        let e = c;
        while (c >= 0 && hours[e + 1] && hours[e + 1].state === 'charge_grid') e++;
        kept_for = c < 0 ? nextDay : { start: hours[c].start, end: iso(Date.parse(hours[e].start) + H), kind: 'refill' };
      }
      const kind = h.state === 'charge_grid' ? 'charge' : release ? h.state : 'hold';
      h.why = { keep_eur: r3(keep), use_eur: r3(use), kind, kept_for };
    });
    // A house hour whose energy is planned to be bought back in a later grid-charge run.
    const rf = hours.findIndex((h) => h.state === 'house' && h.start.startsWith(`${dates[1]}T18`));
    const rc = hours.findIndex((h, n) => n > rf && h.state === 'charge_grid');
    if (rf >= 0 && rc >= 0) {
      let e = rc;
      while (hours[e + 1] && hours[e + 1].state === 'charge_grid') e++;
      hours[rf].why = { kind: 'house', use_eur: 0.38, keep_eur: 0.18, kept_for: { start: hours[rc].start, end: iso(Date.parse(hours[e].start) + H), kind: 'refill' } };
      // A held hour just before that run: using it now means buying it back there.
      if (hours[rc - 1].state === 'idle') hours[rc - 1].why = { kind: 'hold', use_eur: 0.24, keep_eur: 0.31, kept_for: hours[rf].why.kept_for };
    }
    // Hours at and under the backup reserve: no values compared, only a plain line.
    const rh = hours.findIndex((h) => h.start.startsWith(`${dates[2]}T20`));
    if (rh >= 0) hours[rh].why = { kind: 'reserve_hold', refill_at: null };
    if (rh >= 0) hours[rh + 1].why = { kind: 'reserve_use', refill_at: hours[rh + 3].start };
    const days = dates.map((date, k) => {
      const rows = hours.filter((h) => h.start.startsWith(date));
      const sum = (...f) => Math.round(rows.reduce((a, h) => a + f.reduce((b, x) => b + h[x], 0), 0) * 100) / 100;
      const priced = !unpriced(k);
      // The cheapest 3 consecutive priced hours still ahead, as the server's cheapest_window.
      const ahead = rows.filter((h) => h.plan && h.price !== null);
      let cheap = null;
      for (let i = 0; k > 0 && i + 3 <= ahead.length; i++) {
        const mean = ahead.slice(i, i + 3).reduce((a, h) => a + h.price, 0) / 3;
        if (!cheap || mean < cheap.price) cheap = { start: ahead[i].start, end: iso(Date.parse(ahead[i + 2].start) + H), price: Math.round(mean * 1e4) / 1e4 };
      }
      return {
        cheap,
        date,
        use_kwh: sum('use_kwh'),
        use_cost_eur: priced ? Math.round(rows.reduce((a, h) => a + h.use_kwh * h.price, 0) * 90) / 100 : null,
        saved_eur: priced ? [-1.2, 0.19, 1.1][k] : null,
        solar_gain_eur: priced ? (CASE === 'dst' ? 0 : [0.08, 0.42, 0.31][k]) : null,
        batt_grid_eur: priced ? (CASE === 'dst' && k === 1 ? 0.004 : [0.85, -1.55, 0.4][k]) : null,
        avg_price: priced ? Math.round((rows.reduce((a, h) => a + h.price, 0) / rows.length) * 1000) / 1000 : null,
        solar_kwh: sum('solar_kwh'),
        planned: ['none', 'partial', 'full'][k],
        grid_in_kwh: priced ? sum('grid_in_house_kwh', 'grid_in_charge_kwh') : null,
        grid_out_kwh: priced ? sum('grid_out_kwh') : null,
        // Export at the debug slots' tariff, the import price less 0.05.
        grid_bought_eur: priced ? Math.round(rows.reduce((a, h) => a + (h.grid_in_house_kwh + h.grid_in_charge_kwh) * h.price, 0) * 100) / 100 : null,
        grid_sold_eur: priced ? Math.round(rows.reduce((a, h) => a + h.grid_out_kwh * (h.price - 0.05), 0) * 100) / 100 : null,
      };
    });
    for (const d of days) d.grid_bill_eur = d.grid_bought_eur === null ? null : Math.round((d.grid_bought_eur - d.grid_sold_eur) * 100) / 100;
    // A day that sold more than it bought, at its widest.
    if (CASE === 'wide') Object.assign(days[1], { grid_bought_eur: 113.7, grid_sold_eur: 127.35, grid_bill_eur: -13.65 });
    // Days as an older backend sends them, without the grid bill.
    if (CASE === 'old') for (const d of days) ['grid_bought_eur', 'grid_sold_eur', 'grid_bill_eur'].forEach((k) => delete d[k]);
    // Today's name line at its widest: a large sun figure and a negative average price.
    if (CASE === 'wide') Object.assign(days[1], { solar_gain_eur: -12.42, avg_price: -0.414 });
    const cur = hours.find((h) => Date.parse(h.start) === nowHour) || hours[hours.length - 1];
    return {
      battery: { soc: cur.soc, stored_kwh: Math.round(cur.soc * 20.48) / 100, stored_cost_eur_per_kwh: 0.318, break_even_eur_per_kwh: 0.34, state: CASE === 'noswitch' ? 'disabled' : cur.state, margin_30d_eur: CASE === 'wide' ? -1234.56 : 28.4, solar_gain_30d_eur: CASE === 'wide' ? 456.78 : CASE === 'dst' ? 0 : 3.1, balance_eur: CASE === 'wide' ? 138.4 : -0.7 },
      days,
      hours,
    };
  }

  // The debug command's answer: the stored first plan is the hours perturbed, per quarter, with gaps.
  function debugData(hours) {
    const r3 = (v) => Math.round(v * 1000) / 1000;
    const reference = [];
    for (const h of CASE === 'debug-empty' ? [] : hours) {
      const t = Date.parse(h.start);
      const day = h.start.slice(0, 10);
      const hh = parts(t).hour;
      // Nothing stored for today's 03:00 hour; yesterday's plan was first built at 00:30.
      if (day > TODAY || h.start.startsWith(`${TODAY}T03`)) continue;
      const k = day < TODAY ? -1 : 1;
      const f = 1 + 0.3 * Math.sin(hh * 1.3 + k);
      // One hourly row holds the hour's four quarters, with the last quarter's level.
      const n = CASE === 'debug-mixed' && k < 0 ? 4 : 1;
      for (let q = n > 1 ? 3 : k < 0 && hh === 0 ? 2 : 0; q < 4; q++) {
        if (CASE === 'debug-gap' && k > 0 && hh === 11 && q === 2) continue;
        reference.push({
          start: iso(t + (n > 1 ? 0 : q) * 900e3),
          minutes: n > 1 ? 60 : 15,
          soc: h.soc === null ? null : Math.max(5, Math.min(100, h.soc + k * (2 + hh * 0.6) - (3 - q) * 2)),
          load_kwh: r3((h.use_kwh * f * n) / 4),
          pv_kwh: r3((h.solar_kwh * 1.25 * n) / 4),
          grid_charge_kwh: r3(((h.grid_in_charge_kwh || 0) * 1.1 * n) / 4),
          solar_charge_kwh: 0,
          grid_export_kwh: r3(((h.state === 'export' ? h.grid_out_kwh : hh === 16 ? 1.2 : 0) * n) / 4),
          self_discharge_kwh: 0.025 * n,
        });
      }
    }
    // Quarter rows that add up to the hours; today 06:00 and 05:15 have no samples, and 02:15 delivers 70% of its setpoint.
    // Grid cost under the plan row of the same start and width and as measured; debug-gap has no export price in export hours.
    const planned = new Map(reference.map((x) => [x.start, x]));
    const r4 = (v) => Math.round(v * 1e4) / 1e4;
    const cost = (inn, out, price, ep) => (price === null || (out > 1e-6 && ep === null) ? null : r4(inn * price - out * (ep || 0)));
    const flows = (f) => [f.grid_charge_kwh + Math.max(f.load_kwh - f.pv_kwh, 0), f.grid_export_kwh];
    const paid = new Map();
    const slots = [];
    hours.forEach((h, n) => {
      const { why, ...base } = h;
      const t = Date.parse(h.start);
      const s0 = n ? hours[n - 1].soc : h.soc;
      const sp = h.state === 'charge_grid' ? h.grid_in_charge_kwh * 1000 : h.state === 'export' ? -h.grid_out_kwh * 1000 : 0;
      for (let q = 0; q < 4; q++) {
        const at = iso(t + q * 900e3);
        if (at.startsWith(`${TODAY}T06`) || at.startsWith(`${TODAY}T05:15`)) continue;
        const quarter = (key) => (h[key] == null ? h[key] : r3(h[key] / 4));
        const measured = t + q * 900e3 < NOW;
        const batt = h.state === 'house' ? -(h.batt_house_kwh || 0) * 1000 : sp * (at.startsWith(`${TODAY}T02:15`) ? 0.7 : 0.97);
        const price = h.price === null ? null : r3(h.price + (q - 1.5) * 0.004);
        const plan = t + (q + 1) * 900e3 > NOW;
        const ep = price === null || (CASE === 'debug-gap' && h.state === 'export') ? null : r3(price - 0.05);
        const f = planned.get(at);
        const pe = plan || !f || f.minutes !== 15 ? null : cost(...flows(f), price, ep);
        const re = plan ? null : cost(quarter('grid_in_house_kwh') + quarter('grid_in_charge_kwh'), quarter('grid_out_kwh'), price, ep);
        paid.set(t + q * 900e3, { re, price, ep });
        slots.push({
          ...base,
          start: at,
          price,
          soc: h.soc === null || s0 === null ? h.soc : Math.round((s0 + ((h.soc - s0) * (q + 1)) / 4) * 10) / 10,
          plan,
          ...Object.fromEntries(['use_kwh', 'solar_kwh', 'batt_house_kwh', 'grid_in_house_kwh', 'grid_in_charge_kwh', 'grid_out_kwh'].map((key) => [key, quarter(key)])),
          setpoint_w: h.price === null ? null : sp,
          batt_w: measured ? Math.round(batt) : null,
          export_price: ep,
          plan_eur: pe === null || re === null ? null : pe,
          real_eur: pe === null || re === null ? null : re,
        });
      }
    });
    // Per hour with a quarter over: its plan rows, each at the mean price of the quarters it spans, against what was paid.
    const hour_costs = {};
    for (const h of hours) {
      const t = Date.parse(h.start);
      const qs = [0, 1, 2, 3].map((q) => paid.get(t + q * 900e3));
      if (!qs.some((c) => c && c.re !== null)) continue;
      const rows = reference.filter((x) => Date.parse(x.start) - t >= 0 && Date.parse(x.start) - t < H);
      const tiled = rows.reduce((end, x) => (end === Date.parse(x.start) ? end + x.minutes * 60e3 : NaN), t) === t + H;
      const mean = (on, key) => (on.some((c) => c[key] === null) ? null : on.reduce((a, c) => a + c[key], 0) / on.length);
      const plan = rows.map((x) => {
        const d = Date.parse(x.start) - t;
        const on = qs.filter((c, q) => c && q * 900e3 >= d && q * 900e3 < d + x.minutes * 60e3);
        return cost(...flows(x), mean(on, 'price'), mean(on, 'ep'));
      });
      const ok = tiled && qs.every((c) => c && c.re !== null) && !plan.includes(null);
      hour_costs[h.start] = ok ? { plan_eur: r4(plan.reduce((a, v) => a + v, 0)), real_eur: r4(qs.reduce((a, c) => a + c.re, 0)) } : { plan_eur: null, real_eur: null };
    }
    const stale = CASE === 'debug-stale';
    const built = iso(NOW - 5 * 60e3);
    const internals = {
      built_at: built,
      // debug-stale: prices end tonight, tomorrow estimated, a 2 h old sun forecast and a 7 min old battery reading.
      prices_until: iso(midnight(addDays(TODAY, stale ? 1 : 2))),
      tomorrow_estimated: stale,
      battery_sample_age_s: stale ? 420 : 8,
      pv_forecast_age_s: stale ? 7300 : 1260,
      forecast_source: 'remote',
      load_correction_ratio: 0.86,
      reserve_soc: 12.4,
      target_soc: 100,
      end_value_eur_per_kwh: 0.21,

      const el = root.elementFromPoint(x2, y);
      fire(el, 'pointerdown', x2, y);
      for (const dy of [4, 12, 30]) fire(el, 'pointermove', x2 + 1, y - dy);
      fire(el, 'pointercancel', x2 + 1, y - 30);
      say(`drag: ${row !== null && tipRow() === row ? 'tooltip stayed' : 'TOOLTIP MOVED'}${window.DEBUG ? (cap() === before ? ', caption stayed' : ', CAPTION CHANGED') : ''}`);
    }
    if (HOVER.rerender) {
      const st = window.HASS.states['sensor.smartgrid_power_card'];
      card.hass = { ...window.HASS, states: { ...window.HASS.states, 'sensor.smartgrid_power_card': { ...st } } };
    }
  }
</script>
